<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Elegance Fusion</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    .shop-layout {
      display: flex;
      gap: 30px;
      margin-top: 2rem;
    }
    
    .sidebar {
      flex: 0 0 250px;
    }
    
    .filter-section {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }
    
    .filter-section h4 {
      font-family: var(--font-main);
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    
    .filter-label {
      display: block;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }
    
    .filter-label input {
      margin-right: 10px;
    }
    
    .main-content {
      flex: 1;
    }
    
    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .sort-select {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: inherit;
    }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    @media (max-width: 768px) {
      .shop-layout { flex-direction: column; }
      .sidebar { flex: 1; }
    }
  </style>
</head>
<body>

  <!-- Navbar Placeholder (In a real app, this would be a partial) -->
  <nav class="navbar">
    <div class="container">
      <div class="logo">Elegance<span>Fusion</span></div>
      <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html?category=Men">Men</a>
        <a href="shop.html?category=Women">Women</a>
        <a href="shop.html?category=Kids">Kids</a>
        <a href="shop.html?new=true">New Arrivals</a>
        <a href="offers.html">Offers</a>
        <a href="tailoring.html">Tailoring</a>
        <a href="shop.html" class="active">Shop</a>
      </div>
      <div class="nav-icons">
        <a href="#"><i class="fas fa-search"></i></a>
        <a href="shop.html?wishlist=true"><i class="far fa-heart"></i><span class="badge" id="wishlist-badge" style="display:none;">0</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="badge" id="cart-badge" style="display:none;">0</span></a>
        <a href="#"><i class="far fa-user"></i></a>
      </div>
    </div>
  </nav>

  <div class="container mt-2">
    <h1 class="section-title">Shop Collection</h1>
    
    <div class="shop-layout">
      <!-- Filters Sidebar -->
      <aside class="sidebar">
        <div class="filter-section">
          <h4>Category</h4>
          <label class="filter-label"><input type="checkbox" value="Men" class="filter-cb" data-filter="category"> Men</label>
          <label class="filter-label"><input type="checkbox" value="Women" class="filter-cb" data-filter="category"> Women</label>
          <label class="filter-label"><input type="checkbox" value="Kids" class="filter-cb" data-filter="category"> Kids</label>
        </div>
        
        <div class="filter-section">
          <h4>Price Range</h4>
          <label class="filter-label"><input type="radio" name="price" value="0-499" class="filter-radio" data-filter="price"> Under ₹499</label>
          <label class="filter-label"><input type="radio" name="price" value="0-999" class="filter-radio" data-filter="price"> Under ₹999</label>
          <label class="filter-label"><input type="radio" name="price" value="1000-2000" class="filter-radio" data-filter="price"> ₹1000 - ₹2000</label>
          <label class="filter-label"><input type="radio" name="price" value="2000-10000" class="filter-radio" data-filter="price"> Above ₹2000</label>
          <label class="filter-label"><input type="radio" name="price" value="all" class="filter-radio" data-filter="price" checked> All</label>
        </div>
      </aside>
      
      <!-- Main Content -->
      <main class="main-content">
        <div class="shop-header">
          <div id="result-count">0 Products Found</div>
          <div>
            <select class="sort-select" id="sort-select">
              <option value="popular">Sort by: Popular</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="newest">Newest First</option>
              <option value="discount">Biggest Discount</option>
            </select>
          </div>
        </div>
        
        <div class="products-grid" id="shop-products">
          <!-- Injected via JS -->
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('category');
      const maxPriceParam = urlParams.get('maxPrice');
      const isWishlist = urlParams.get('wishlist');
      
      if (catParam) {
        const checkbox = document.querySelector(`.filter-cb[value="${catParam}"]`);
        if(checkbox) checkbox.checked = true;
      }
      if (maxPriceParam) {
        const radio = document.querySelector(`.filter-radio[value="0-${maxPriceParam}"]`);
        if(radio) radio.checked = true;
      }
      
      function renderShop() {
        // Get active filters
        const activeCategories = Array.from(document.querySelectorAll('.filter-cb[data-filter="category"]:checked')).map(cb => cb.value);
        const priceFilter = document.querySelector('.filter-radio[data-filter="price"]:checked').value;
        const sortMode = document.getElementById('sort-select').value;
        
        let filteredProducts = products.filter(p => {
          if (isWishlist === 'true') return wishlist.includes(p.id);
          
          let catMatch = activeCategories.length === 0 || activeCategories.includes(p.category);
          
          let priceMatch = true;
          if (priceFilter !== 'all') {
            const [min, max] = priceFilter.split('-').map(Number);
            priceMatch = p.discountedPrice >= min && p.discountedPrice <= max;
          }
          
          return catMatch && priceMatch;
        });
        
        // Sorting
        if (sortMode === 'price-low') {
          filteredProducts.sort((a,b) => a.discountedPrice - b.discountedPrice);
        } else if (sortMode === 'price-high') {
          filteredProducts.sort((a,b) => b.discountedPrice - a.discountedPrice);
        } else if (sortMode === 'newest') {
          filteredProducts.sort((a,b) => (a.isNew === b.isNew)? 0 : a.isNew ? -1 : 1);
        } else if (sortMode === 'discount') {
          filteredProducts.sort((a,b) => b.discountPercentage - a.discountPercentage);
        } else {
          filteredProducts.sort((a,b) => (a.isBestSeller === b.isBestSeller)? 0 : a.isBestSeller ? -1 : 1);
        }
        
        document.getElementById('result-count').textContent = `${filteredProducts.length} Products Found`;
        document.getElementById('shop-products').innerHTML = filteredProducts.map(p => renderProductCard(p)).join('');
      }
      
      // Event Listeners
      document.querySelectorAll('.filter-cb, .filter-radio').forEach(el => el.addEventListener('change', renderShop));
      document.getElementById('sort-select').addEventListener('change', renderShop);
      
      // Init
      renderShop();
    });
  </script>
</body>
</html>
