<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Elegance Fusion</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    .checkout-layout {
      display: flex;
      gap: 30px;
      margin-top: 2rem;
    }
    
    .checkout-form {
      flex: 2;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    
    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: inherit;
    }
    
    .form-row {
      display: flex;
      gap: 15px;
    }
    
    .form-row .form-group {
      flex: 1;
    }
    
    .section-header {
      font-family: var(--font-main);
      font-size: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
      margin-top: 2rem;
    }
    
    .payment-methods {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .payment-method {
      display: flex;
      align-items: center;
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
    }
    
    .payment-method input {
      margin-right: 15px;
    }
    
    .checkout-summary {
      flex: 1;
    }

    .success-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-content {
      background: white;
      padding: 3rem;
      text-align: center;
      border-radius: 8px;
      max-width: 500px;
    }

    @media (max-width: 768px) {
      .checkout-layout { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <div class="logo">Elegance<span>Fusion</span></div>
      <div class="nav-links">
        <a href="index.html">Home</a>
      </div>
    </div>
  </nav>

  <div class="container mt-2">
    <h1 class="section-title">Checkout</h1>
    
    <div class="checkout-layout">
      <div class="checkout-form">
        <form id="checkoutForm" onsubmit="handleCheckout(event)">
          <h3 class="section-header" style="margin-top:0;">1. Delivery Address</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label>Full Name *</label>
              <input type="text" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Mobile Number *</label>
              <input type="tel" class="form-control" required>
            </div>
          </div>
          
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control">
          </div>
          
          <div class="form-group">
            <label>Address * (House No, Building, Street, Area)</label>
            <input type="text" class="form-control" required>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>City *</label>
              <input type="text" class="form-control" required>
            </div>
            <div class="form-group">
              <label>State *</label>
              <select class="form-control" required>
                <option value="">Select State</option>
                <option>Maharashtra</option>
                <option>Delhi</option>
                <option>Karnataka</option>
                <option>Tamil Nadu</option>
                <option>Gujarat</option>
              </select>
            </div>
            <div class="form-group">
              <label>Pincode *</label>
              <input type="text" class="form-control" required>
            </div>
          </div>
          
          <h3 class="section-header">2. Payment Method</h3>
          
          <div class="payment-methods">
            <label class="payment-method">
              <input type="radio" name="payment" value="upi" required>
              <i class="fab fa-google-pay" style="font-size:1.5rem; margin-right:10px; color:#4285F4;"></i> UPI (Google Pay, PhonePe, Paytm)
            </label>
            <label class="payment-method">
              <input type="radio" name="payment" value="card">
              <i class="far fa-credit-card" style="font-size:1.5rem; margin-right:10px;"></i> Credit / Debit Card
            </label>
            <label class="payment-method">
              <input type="radio" name="payment" value="netbanking">
              <i class="fas fa-university" style="font-size:1.5rem; margin-right:10px;"></i> Net Banking
            </label>
            <label class="payment-method">
              <input type="radio" name="payment" value="cod">
              <i class="fas fa-money-bill-wave" style="font-size:1.5rem; margin-right:10px; color:var(--success-color);"></i> Cash on Delivery (COD)
            </label>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 2rem; font-size: 1.1rem; padding: 15px;">Place Order</button>
        </form>
      </div>
      
      <div class="checkout-summary" id="checkout-summary">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if(cart.length === 0) {
        window.location.href = 'shop.html';
        return;
      }
      
      let subTotal = 0;
      let totalDiscount = 0;
      
      cart.forEach((item) => {
        const product = products.find(p => p.id === item.id);
        if(!product) return;
        subTotal += product.originalPrice * item.quantity;
        totalDiscount += (product.originalPrice - product.discountedPrice) * item.quantity;
      });
      
      const grandTotal = subTotal - totalDiscount;
      const delivery = grandTotal > 999 ? 0 : 99;
      const finalAmount = grandTotal + delivery;
      
      const formatCurrency = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);
      
      const summaryHtml = `
        <div style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px;">
          <h3 style="font-family: var(--font-main); margin-bottom: 1.5rem; margin-top:0;">Order Summary</h3>
          <p style="margin-bottom:1rem; color:#555;">${cart.length} item(s) in cart</p>
          
          <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <span>Subtotal</span>
            <span>${formatCurrency(subTotal)}</span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--success-color);">
            <span>Discount</span>
            <span>-${formatCurrency(totalDiscount)}</span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <span>Delivery Charges</span>
            <span style="color: var(--success-color);">${delivery === 0 ? 'Free' : formatCurrency(delivery)}</span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; font-weight: 700; font-size: 1.2rem;">
            <span>Amount Payable</span>
            <span>${formatCurrency(finalAmount)}</span>
          </div>
        </div>
      `;
      
      document.getElementById('checkout-summary').innerHTML = summaryHtml;
    });

    function handleCheckout(e) {
      e.preventDefault();
      
      // Simulate Order Success
      const modal = document.createElement('div');
      modal.className = 'success-modal';
      modal.innerHTML = `
        <div class="modal-content">
          <i class="fas fa-check-circle" style="font-size: 5rem; color: var(--success-color); margin-bottom: 1rem;"></i>
          <h2>Order Placed Successfully!</h2>
          <p style="margin: 1rem 0; color: #555;">Thank you for shopping with Elegance Fusion. Your order ID is #ORD${Math.floor(Math.random() * 90000) + 10000}.</p>
          <button class="btn btn-primary" onclick="finishOrder()">Continue Shopping</button>
        </div>
      `;
      document.body.appendChild(modal);
    }
    
    function finishOrder() {
      cart = [];
      saveState();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
